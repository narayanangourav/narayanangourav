<svg xmlns="http://www.w3.org/2000/svg" width="182" height="40" viewBox="0 0 182 40" fill="none" role="img" aria-label="Explore portfolio">
<style>
.sans{font-family:Geist,Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif}
