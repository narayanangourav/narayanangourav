<svg xmlns="http://www.w3.org/2000/svg" width="880" height="344" viewBox="0 0 880 344" fill="none" role="img" aria-label="Thanks for stopping by. Build clearly. Automate carefully. Ship reliably. Got a tough challenge? Let&#x27;s dig in. The links up top reach me fastest.">
<style>
.s{font-family:Geist,Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif}
.m{font-family:'Geist Mono',ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,monospace}
.h1{font-size:56px;font-weight:600;letter-spacing:-1.6px}
.h2{font-size:44px;font-weight:600;letter-spacing:-1.2px}
.t1{font-size:20px;font-weight:400}
.t2{font-size:18px;font-weight:500;letter-spacing:-0.2px}
.b3{font-size:16px;font-weight:400}
.b1{font-weight:600}
.b4{font-size:14px;font-weight:600}
.b6{font-size:14px;font-weight:400}
.cap{font-size:12px;font-weight:500;letter-spacing:1.2px}
.code{font-size:14px;font-weight:400;white-space:pre}
.chip{font-size:13px;font-weight:500}
.in{opacity:0;transform:translateY(16px);animation:in 700ms cubic-bezier(0.22,1,0.36,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.in{transform:none;animation:fade 500ms cubic-bezier(0.22,1,0.36,1) forwards}}

.w{fill:#1F2328;animation:lit 9s cubic-bezier(0.22,1,0.36,1) infinite both}
@keyframes lit{0%{fill:#8C959F}7%{fill:#1F2328}80%{fill:#1F2328}90%{fill:#8C959F}100%{fill:#8C959F}}
@media (prefers-reduced-motion:reduce){.w{fill:#1F2328;animation:none}}</style>
<rect x="0" y="0" width="880" height="1" fill="#D1D9E0"/><text x="0" y="52" class="m cap" fill="#1A7F37">07</text><text x="0" y="80" class="s t2" fill="#1F2328">Thanks for stopping by</text><text x="238" y="84" class="s h2"><tspan class="w" style="animation-delay:400ms">Build</tspan> <tspan class="w" style="animation-delay:660ms">clearly.</tspan></text><text x="238" y="132" class="s h2"><tspan class="w" style="animation-delay:920ms">Automate</tspan> <tspan class="w" style="animation-delay:1180ms">carefully.</tspan></text><text x="238" y="180" class="s h2"><tspan class="w" style="animation-delay:1440ms">Ship</tspan> <tspan class="w" style="animation-delay:1700ms">reliably.</tspan></text><text x="240" y="272" class="s b3" fill="#59636E">Got a tough challenge? Let&#8217;s dig in. The links up top reach me fastest.</text><rect x="0" y="343" width="880" height="1" fill="#D1D9E0"/>
</svg>
