<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="342" viewBox="0 0 880 342" fill="none" role="img" aria-label="Building Better, Together. I am open to collaborating on: Full-stack applications using Python, Java, React, Next.js, and TypeScript; REST, RPC, and gRPC API development; PostgreSQL and database-focused systems; Cloud-native and serverless applications on AWS and GCP; CI/CD pipelines, infrastructure as code, and engineering automation; Data analytics and internal engineering platforms; Open-source tools that improve developer productivity.">
<style>
.s{font-family:Geist,Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif}
.m{font-family:'Geist Mono',ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,monospace}
.h1{font-size:56px;font-weight:600;letter-spacing:-1.6px}
.h2{font-size:44px;font-weight:600;letter-spacing:-1.2px}
.t1{font-size:20px;font-weight:400}
.t2{font-size:18px;font-weight:500;letter-spacing:-0.2px}
.b3{font-size:16px;font-weight:400}
.b1{font-weight:600}
.b4{font-size:14px;font-weight:600}
