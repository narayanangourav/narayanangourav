<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="520" viewBox="0 0 880 520" fill="none" role="img" aria-label="Current Focus. Backend Engineering: APIs, databases and scalable services with Django, Django REST Framework, Flask, FastAPI, Node.js and Express. Frontend Engineering: React.js, Next.js, TypeScript and Tailwind CSS. API Development: REST, RPC and gRPC services, plus WebSockets for real time features. Cloud &amp; DevOps: AWS (EC2, Lambda, S3) and GCP, CI/CD with GitHub Actions and Jenkins, Docker and Kubernetes. Automation: Terraform infrastructure, Python and Bash scripting, scheduled jobs. Data Engineering: PostgreSQL, MySQL, MongoDB, BigQuery and analytics. Code Quality: Jest, React Testing Library, SonarQube, static analysis and clean architecture. AI-Assisted Coding: OpenAI Codex, Claude Code and modern developer workflows.">
