<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="284" viewBox="0 0 880 284" fill="none" role="img" aria-label="About Me. 2+ years of engineering experience across backend, frontend, and cloud. Focused on Python, Java, TypeScript, React.js, and SQL. Building backend systems, web applications, automation, and data workflows. Hands-on with cloud engineering on AWS and GCP, serverless systems, and DevOps. Strong believer in clean architecture, testing, and measurable improvement. I solve root causes instead of applying temporary patches.">
<style>
.s{font-family:Geist,Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif}
.m{font-family:'Geist Mono',ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,monospace}
.h1{font-size:56px;font-weight:600;letter-spacing:-1.6px}
.h2{font-size:44px;font-weight:600;letter-spacing:-1.2px}
.t1{font-size:20px;font-weight:400}
.t2{font-size:18px;font-weight:500;letter-spacing:-0.2px}
.b3{font-size:16px;font-weight:400}
.b1{font-weight:600}
.b4{font-size:14px;font-weight:600}
.b6{font-size:14px;font-weight:400}
.cap{font-size:12px;font-weight:500;letter-spacing:1.2px}
.code{font-size:14px;font-weight:400;white-space:pre}
.chip{font-size:13px;font-weight:500}
.in{opacity:0;transform:translateY(16px);animation:in 700ms cubic-bezier(0.22,1,0.36,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.in{transform:none;animation:fade 500ms cubic-bezier(0.22,1,0.36,1) forwards}}
</style>
<rect x="0" y="0" width="880" height="1" fill="#30363D"/><text x="0" y="52" class="m cap" fill="#3DD68C">01</text><text class="s t2" fill="#F0F6FC"><tspan x="0" y="80">About Me</tspan></text><text x="240" y="57" class="m cap" fill="#6E7681">—</text><text x="268" y="58" class="s b3" fill="#9BA3AE"><tspan class="b1" fill="#F0F6FC">2+ years of engineering experience</tspan> across backend, frontend, and cloud</text><text x="240" y="93" class="m cap" fill="#6E7681">—</text><text x="268" y="94" class="s b3" fill="#9BA3AE">Focused on <tspan class="b1" fill="#F0F6FC">Python, Java, TypeScript, React.js, and SQL</tspan></text><text x="240" y="129" class="m cap" fill="#6E7681">—</text><text x="268" y="130" class="s b3" fill="#9BA3AE">Building backend systems, web applications, automation, and data workflows</text><text x="240" y="165" class="m cap" fill="#6E7681">—</text><text x="268" y="166" class="s b3" fill="#9BA3AE">Hands-on with <tspan class="b1" fill="#F0F6FC">cloud engineering on AWS and GCP</tspan>, serverless systems, and DevOps</text><text x="240" y="201" class="m cap" fill="#6E7681">—</text><text x="268" y="202" class="s b3" fill="#9BA3AE">Strong believer in clean architecture, testing, and measurable improvement</text><text x="240" y="237" class="m cap" fill="#6E7681">—</text><text x="268" y="238" class="s b3" fill="#9BA3AE">I solve root causes instead of applying temporary patches</text>
